# Deploy del servidor — docs/02 §8. Una región cercana a los jugadores.
app = "totem-server"
primary_region = "mad"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  PORT = "2567"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true          # WSS obligatorio
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/hc"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
