name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de `packageManager` en package.json (indicarla aquí también hace fallar la acción).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (incluye cero strings hardcodeados)
        run: pnpm lint
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests
        run: pnpm -r test
      - name: Cobertura de core (>= 90 %)
        run: pnpm --filter @totem/core test:cov
      - name: Fuzz (I10 reducido)
        run: pnpm sim -- --games 500
      - name: Build cliente
        run: pnpm --filter @totem/client build
      - name: Build imagen del servidor
        run: docker build -f packages/server/Dockerfile -t totem-server .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de `packageManager` en package.json (indicarla aquí también hace fallar la acción).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @totem/client exec playwright install --with-deps chromium
      - name: Smoke Playwright
        run: pnpm --filter @totem/client e2e
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}

  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de `packageManager` en package.json (indicarla aquí también hace fallar la acción).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim -- --games 10000
      - run: pnpm sim -- --games 2000 --mode classic
